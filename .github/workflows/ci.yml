name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-check:
    name: Backend build / lint / test / migration dry-run
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: fms_test
          POSTGRES_USER: fms
          POSTGRES_PASSWORD: fms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fms"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache-dependency-path: backend/go.sum
      - name: Verify module integrity
        run: go mod verify
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Test with race detector and coverage
        run: go test -race -cover ./...
      - name: Migration dry-run (up then down)
        env:
          PGHOST: localhost
          PGPORT: ${{ job.services.postgres.ports[5432] }}
          PGDATABASE: fms_test
          PGUSER: fms
          PGPASSWORD: fms
        run: |
          migrate() { go run -mod=mod github.com/golang-migrate/migrate/v4/cmd/migrate -path ../backend/migrations "$@"; }
          MIGRATE_URL="postgres://fms:fms@localhost:${{ job.services.postgres.ports[5432] }}/fms_test?sslmode=disable"
          migrate -database "$MIGRATE_URL" up
          migrate -database "$MIGRATE_URL" down --all

  backend-security:
    name: Backend SAST + Go vulnerability scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache-dependency-path: backend/go.sum
      - name: Run Gosec SAST
        uses: securego/gosec@v2.21.4
        with:
          args: -severity=high -severity=medium -exit-code 1 ./...
      - name: Run govulncheck
        uses: govulncheck/govulncheck-action@v1
        with:
          go-version-input: '1.22.x'
          go-package: ./...

  frontend-check:
    name: Frontend lint / test / build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build

  frontend-security:
    name: Frontend dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm audit (fail on high/critical)
        run: npm audit --audit-level=high

  container-scan:
    name: Container image CVE scan
    needs: [backend-check, frontend-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend api image
        run: docker build --target api -t "fms-api:${{ github.sha }}" ./backend
      - name: Build backend worker image
        run: docker build --target worker -t "fms-worker:${{ github.sha }}" ./backend
      - name: Build frontend image
        run: docker build -t "fms-frontend:${{ github.sha }}" ./frontend
      - name: Trivy scan backend api image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: "fms-api:${{ github.sha }}"
          format: sarif
          output: trivy-api.sarif
          trivy-config: --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed
      - name: Trivy scan backend worker image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: "fms-worker:${{ github.sha }}"
          format: sarif
          output: trivy-worker.sarif
          trivy-config: --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed
      - name: Trivy scan frontend image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: "fms-frontend:${{ github.sha }}"
          format: sarif
          output: trivy-frontend.sarif
          trivy-config: --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed
      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-api.sarif,trivy-worker.sarif,trivy-frontend.sarif
      - name: Upload scan artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trivy-sarif
          path: |
            trivy-api.sarif
            trivy-worker.sarif
            trivy-frontend.sarif
          retention-days: 30