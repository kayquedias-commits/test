# SPA runtime config for the FMS frontend container.
# TLS is terminated at the cluster ingress; nginx listens on port 80 only.

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile    on;
    tcp_nopush  on;

    # Do not disclose the nginx version in Server header / error pages.
    server_tokens off;

    # HSTS is only meaningful over HTTPS, which is terminated at the ingress.
    # Browsers ignore Strict-Transport-Security on plain HTTP, so emit it only
    # when the request arrives over https.
    map $scheme $hsts {
        https   "max-age=31536000; includeSubDomains";
        default "";
    }

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/plain
                    text/css
                    text/html
                    application/javascript
                    application/json
                    image/svg+xml;

    server {
        listen       80;
        server_name  _;
        root         /usr/share/nginx/html;
        index        index.html;

        # Every location below that sets its own add_header replaces the
        # inherited set, so security headers are repeated inside index.html and
        # /assets/ locations. `always` keeps them on error responses as well.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security $hsts always;

        # default-src 'self' blocks inline scripts and eval (no unsafe-eval /
        # unsafe-inline in any script-src). style-src explicitly allows inline
        # styles so the component library does not render unstyled. img-src
        # keeps data: for inline SVG icons used by the design system.
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'; style-src 'self' 'unsafe-inline'; worker-src 'self'; upgrade-insecure-requests;" always;

        # The root document must never be cached long-term: a stale index.html
        # would pin users to an old, possibly superseded, bundle.
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Strict-Transport-Security $hsts always;
            add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'; style-src 'self' 'unsafe-inline'; worker-src 'self'; upgrade-insecure-requests;" always;
        }

        # Content-hashed build assets are immutable across deploys. No
        # try_files here so a missing asset returns a true 404, never
        # index.html (a MIME/cache hazard).
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Strict-Transport-Security $hsts always;
            add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'; style-src 'self' 'unsafe-inline'; worker-src 'self'; upgrade-insecure-requests;" always;
        }

        # SPA deep-route fallback. The API lives on the same origin and is
        # served by the ingress, so /v1 is not reverse-proxied here.
        location / {
            try_files $uri /index.html;
        }
    }
}