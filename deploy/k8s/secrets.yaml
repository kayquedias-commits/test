# fms-secrets — bootstrap Secret envelope for FMS runtime workloads.
#
# This manifest only ships PLACEHOLDER values. Every `data` entry is base64 of the
# literal string `CHANGE_ME` (encoded: Q0hBTkdFX01F). It is intentionally committed
# so that any real environment can be bootstrapped and then overwritten: production
# values are injected by the External Secrets Operator (ESO) reading from KMS /
# AWS Secrets Manager. No real credential string may ever be committed to this repo
# (tech spec §9.1: secrets via secrets manager, never hardcoded; CWE-798).
#
# PRODUCTION PATH
#   - A matching `ExternalSecret` (defined separately, outside this file) targets the
#     same name `fms-secrets` / key set and syncs real values from the provider at a
#     configured refreshInterval. The controller MUST replace every key before any
#     workload starts; CI must fail on any residual Q0hBTkdFX01F after sync.
#   - Rotation is key-versioned through ESO. The full procedure (including the atomic
#     DATABASE_URL + POSTGRES_* pairing below) is documented in the repo README/notes.
#
# TLS / trust material is NOT stored here. Certificates and keys are managed by
# cert-manager (see api-ingress.yaml) and have an independent lifecycle; keeping them
# out of this Secret preserves separation of trust domains.
#
# CLUSTER PREREQUISITE
#   Enable encryption at rest for etcd (KMS provider, e.g. aescbc / KMS v2). Without it
#   an `Opaque` Secret is retrievable in plaintext via `kubectl get secret -o yaml`
#   (OWASP K8s Top 10 A04; CWE-311). This must be confirmed by the deployment pipeline
#   before workloads that depend on this Secret are released.
#
# CONSUMER / LEAST-PRIVILEGE CONTRACT
#   - App workloads (api, worker) consume the full envelope the app needs via
#     `envFrom: [{ secretRef: { name: fms-secrets } }]` — config.go reads all 9 keys.
#   - Data-plane workloads MUST reference discrete keys via valueFrom.secretKeyRef,
#     never `envFrom` on the full envelope:
#       postgres-statefulset: POSTGRES_USER, POSTGRES_PASSWORD
#       redis-deployment:     REDIS_PASSWORD
#       rabbitmq-deployment:  RABBITMQ_DEFAULT_USER, RABBITMQ_DEFAULT_PASS
#     Enforcing this split is left to policy (OPA/Kyverno); it keeps JWT_SIGNING_KEY
#     and S3_* out of postgres/redis/rabbitmq pods (least privilege, fault isolation).
#   - S3_* credentials belong only to the worker export/backup path (EXPORT_ENABLED),
#     never to the api pod.
#
# ROTATION INVARIANTS
#   - DATABASE_URL embeds the same credentials held by POSTGRES_USER / POSTGRES_PASSWORD.
#     These are a dual source of truth: they MUST rotate together atomically in a single
#     ExternalSecret push, and DATABASE_URL's embedded user:pass must equal
#     POSTGRES_USER:POSTGRES_PASSWORD. Never rotate one independently.
#   - JWT_SIGNING_KEY is the ACCESS-TOKEN signing key (HS256). It must decode to at least
#     32 random bytes; the config loader rejects any value < 32 bytes or equal to
#     CHANGE_ME at process boot (fail-fast before accepting traffic). Keep a
#     JWT_SIGNING_KEY_PREVIOUS key available (or JWKS kid set) so tokens signed with the
#     prior key verify transiently during rotation; refresh-token rejection degrades
#     gracefully via the Redis blacklist (CWE-321).
apiVersion: v1
kind: Secret
metadata:
  name: fms-secrets
  namespace: fms
type: Opaque
data:
  # App/db bootstrap principal and password (postgres-statefulset init role).
  POSTGRES_USER: "Q0hBTkdFX01F"
  POSTGRES_PASSWORD: "Q0hBTkdFX01F"
  # Connection string; embedded user:pass MUST equal POSTGRES_USER:POSTGRES_PASSWORD
  # and rotate atomically with them (see rotation invariants above).
  DATABASE_URL: "Q0hBTkdFX01F"
  # Redis AUTH secret, used for session/JWT-revocation blacklist and rate-limit counters.
  REDIS_PASSWORD: "Q0hBTkdFX01F"
  # Access-token signing key; MUST decode to >= 32 random bytes (HS256).
  JWT_SIGNING_KEY: "Q0hBTkdFX01F"
  # Object-storage credentials for export/backup worker path; never exported to api pod.
  S3_ACCESS_KEY: "Q0hBTkdFX01F"
  S3_SECRET_KEY: "Q0hBTkdFX01F"
  # RabbitMQ bootstrap principal/password for the durable event backbone (outbox relay).
  RABBITMQ_DEFAULT_USER: "Q0hBTkdFX01F"
  RABBITMQ_DEFAULT_PASS: "Q0hBTkdFX01F"